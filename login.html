<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>actify · sign in</title>
  <meta name="description" content="Sign in to Actify — a free-time recommendation app that finds what to do with the time you actually have.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      overflow-x: clip;
      font-family: "VT323", "Courier New", monospace;
      color: #4a3829;
      background: #fdf2e0;
      background-image:
        radial-gradient(circle at 18% 22%, #ffd6b0 0, transparent 38%),
        radial-gradient(circle at 82% 78%, #ffc1cc 0, transparent 38%);
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff8ec;
      border: 4px solid #4a3829;
      border-radius: 18px;
      padding: 36px 28px 30px;
      box-shadow: 8px 8px 0 #4a3829;
      text-align: center;
    }
    .sparkle {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      display: block;
    }
    .brand {
      font-family: "Press Start 2P", monospace;
      font-size: 22px;
      letter-spacing: 1px;
      color: #4a3829;
      margin: 0 0 10px;
    }
    .brand a {
      color: inherit;
      font: inherit;
      text-decoration: none;
    }
    .brand a:focus-visible { outline: 2px solid #e78fb3; outline-offset: 3px; border-radius: 2px; }
    .tagline {
      font-size: 22px;
      line-height: 1.1;
      color: #7a5a3f;
      margin: 0 0 26px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: #ffffff;
      border: 3px solid #4a3829;
      border-radius: 10px;
      box-shadow: 4px 4px 0 #4a3829;
      font-family: "VT323", monospace;
      font-size: 22px;
      color: #4a3829;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #4a3829;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #4a3829;
    }
    .btn:focus-visible {
      outline: 3px solid #e78fb3;
      outline-offset: 3px;
    }
    .google-icon {
      width: 22px;
      height: 22px;
    }
    .footnote {
      margin: 18px 0 0;
      font-size: 16px;
      color: #a38672;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg
      class="sparkle"
      viewBox="0 0 16 16"
      shape-rendering="crispEdges"
      aria-hidden="true"
    >
      <rect x="7" y="1" width="2" height="2" fill="#e78fb3" />
      <rect x="7" y="5" width="2" height="2" fill="#e78fb3" />
      <rect x="7" y="9" width="2" height="2" fill="#e78fb3" />
      <rect x="7" y="13" width="2" height="2" fill="#e78fb3" />
      <rect x="1" y="7" width="2" height="2" fill="#e78fb3" />
      <rect x="5" y="7" width="2" height="2" fill="#e78fb3" />
      <rect x="9" y="7" width="2" height="2" fill="#e78fb3" />
      <rect x="13" y="7" width="2" height="2" fill="#e78fb3" />
      <rect x="3" y="3" width="2" height="2" fill="#f4a261" />
      <rect x="11" y="3" width="2" height="2" fill="#f4a261" />
      <rect x="3" y="11" width="2" height="2" fill="#f4a261" />
      <rect x="11" y="11" width="2" height="2" fill="#f4a261" />
    </svg>
    <h1 class="brand"><a href="index.html">actify</a></h1>
    <p class="tagline">make today happen</p>
    <button class="btn" type="button" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
        />
        <path
          fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
        />
        <path
          fill="#FBBC05"
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
        />
        <path
          fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
        />
      </svg>
      Continue with Google
    </button>
    <p class="footnote">your cozy daily sidekick</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
